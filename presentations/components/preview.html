<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentations Live Preview</title>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-dark: #1a1a2e;
      --bg-card: #16213e;
      --accent: #667eea;
      --accent-secondary: #764ba2;
      --text: #e0e0e0;
      --text-muted: #a0a0a0;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
    }
    .header {
      background: var(--bg-card);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .header h1 {
      font-size: 24px;
      font-weight: 600;
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      font-size: 14px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3fb950;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      color: white;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: white;
    }
    .main {
      display: grid;
      grid-template-columns: 350px 1fr;
      height: calc(100vh - 80px);
    }
    .sidebar {
      background: var(--bg-card);
      border-right: 1px solid rgba(255,255,255,0.1);
      overflow-y: auto;
      padding: 20px;
    }
    .sidebar-section {
      margin-bottom: 30px;
    }
    .sidebar-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 15px;
    }
    .style-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .style-item {
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }
    .style-item:hover {
      background: rgba(102, 126, 234, 0.2);
    }
    .preview-area {
      padding: 40px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .slide-container {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16/9;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .slide-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .slide-nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }
    .slide-nav button {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background: transparent;
      color: var(--accent);
      font-size: 20px;
      cursor: pointer;
    }
    .slide-nav button:hover {
      background: var(--accent);
      color: white;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Presentations Live Preview</h1>
    <div class="status">
      <div class="status-dot"></div>
      <span>Watching for changes</span>
    </div>
  </div>
  <div class="main">
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">Design Styles (20)</div>
        <div class="style-grid">
          <div class="style-item">Glassmorphism</div>
          <div class="style-item">Neon Cyber</div>
          <div class="style-item">Gradient</div>
          <div class="style-item">Isometric</div>
          <div class="style-item">Brutalist</div>
          <div class="style-item">Corporate</div>
          <div class="style-item">Executive</div>
          <div class="style-item">Clean</div>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">Slide Sizes</div>
        <div class="style-grid">
          <div class="style-item">16:9</div>
          <div class="style-item">4:3</div>
          <div class="style-item">1:1</div>
          <div class="style-item">9:16</div>
          <div class="style-item">21:9</div>
        </div>
      </div>
    </div>
    <div class="preview-area">
      <div class="slide-container">
        <iframe id="previewFrame" src="about:blank"></iframe>
      </div>
      <div class="slide-nav">
        <button onclick="window.previewAPI?.prev()">←</button>
        <button onclick="window.previewAPI?.next()">→</button>
      </div>
    </div>
  </div>
  <script>
    window.previewAPI = {
      reload: () => document.getElementById('previewFrame').src = document.getElementById('previewFrame').src,
      prev: () => {},
      next: () => {},
      applyStyle: (style) => console.log('Apply style:', style),
      changeSize: (size) => console.log('Change size:', size)
    };
  </script>
</body>
</html>
